<!DOCTYPE html>
<html>
<head>
    <title>Smart Library Management System - Applet</title>
</head>
<body style="margin: 0; background-color: #1e1e2f; color: #fff; font-family: sans-serif; text-align: center;">
    <h2 style="padding: 10px;">Smart Library Management System (Applet & JDBC)</h2>
    <applet code="SmartLibraryApplet.class" width="1100" height="750">
        <param name="dbUrl" value="jdbc:sqlite:smart_library.db">
        <p>Your browser does not support Java Applets. You can run the application directly using:</p>
        <code>java SmartLibraryApplet</code>
    </applet>
</body>
</html>
